<!-- src/ui/media/connectionForm/index.html
     Reference copy of the markup inlined as TEMPLATE in src/ui/connectionFormHtml.ts.
     The two are hand-synced and a test (test/ui/connectionFormHtml.test.ts) fails on drift.
     Every {{TOKEN}} here is a literal, unconditional substitution performed by
     buildConnectionFormHtml(); the add-vs-edit-mode logic that computes what each token
     becomes lives in resolveConnectionFormFields(), never in this template. Nothing here is
     ever fetched from the network: both scripts are bundled into dist/media/ at build time
     (see esbuild.js) and loaded strictly through Webview.asWebviewUri, never a CDN. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{NONCE}}'; style-src {{CSP_SOURCE}} 'nonce-{{NONCE}}';" />
<style nonce="{{NONCE}}">
  body {
    font-family: var(--vscode-font-family);
    color: var(--vscode-foreground);
    margin: 0;
  }
  .page {
    display: flex;
    align-items: flex-start;
    width: 100%;
    box-sizing: border-box;
  }
  .form-main {
    flex: 1;
    min-width: 0;
    padding: 0 24px 24px;
    box-sizing: border-box;
  }
  /* The form itself stays a comfortable reading width even though
     .form-main now flexes to fill the rest of the page: an unconstrained
     vscode-text-field would otherwise stretch edge to edge on a wide
     window, which reads worse than the previous fixed-width dialog, not
     better. */
  #connectionForm {
    max-width: 560px;
  }
  h2 {
    font-size: 1.1em;
    font-weight: 600;
    border-bottom: 1px solid var(--vscode-widget-border, var(--vscode-panel-border));
    padding-bottom: 8px;
    margin-top: 20px;
  }
  .field {
    display: flex;
    flex-direction: column;
    margin-bottom: 12px;
  }
  /* main.js toggles the native `hidden` attribute to show only the auth
     fields for the selected method; without this rule .field's own
     `display: flex` (same specificity as the UA stylesheet's [hidden] rule,
     but declared later) wins the cascade and the attribute has no visual
     effect at all. */
  .field[hidden] {
    display: none;
  }
  .field label.field-label {
    font-size: 0.9em;
    opacity: 0.85;
    margin-bottom: 4px;
  }
  .field vscode-text-field,
  .field vscode-dropdown {
    width: 100%;
  }
  .field-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .field-row .field {
    flex: 1;
    margin-bottom: 12px;
  }
  .two-up {
    display: flex;
    gap: 12px;
  }
  .two-up .field {
    flex: 1;
  }
  .field-checkbox {
    margin-bottom: 12px;
  }
  .field-checkbox .field-hint {
    display: block;
    font-size: 0.85em;
    opacity: 0.7;
    margin: 2px 0 0 22px;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 24px;
  }
  /* The remotes list: a left-hand sidebar beside the form, a master list
     beside a detail form -- VS Code has no built-in master/detail widget
     of its own, so this lays it out by hand. */
  .remotes-sidebar {
    width: 260px;
    flex-shrink: 0;
    border-right: 1px solid var(--vscode-widget-border, var(--vscode-panel-border));
    padding: 20px 16px;
    box-sizing: border-box;
  }
  .sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
  }
  .sidebar-header span {
    font-weight: 600;
    opacity: 0.85;
  }
  #remotesList {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .remote-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 8px;
    border-radius: 4px;
    cursor: pointer;
    gap: 4px;
  }
  .remote-row:hover {
    background: var(--vscode-list-hoverBackground);
  }
  .remote-row.active {
    background: var(--vscode-list-activeSelectionBackground);
    color: var(--vscode-list-activeSelectionForeground);
  }
  .remote-row .remote-info {
    min-width: 0;
    overflow: hidden;
  }
  .remote-row .remote-name {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .scope-badge {
    font-weight: 400;
    font-size: 0.75em;
    opacity: 0.75;
    border: 1px solid var(--vscode-widget-border, var(--vscode-panel-border));
    border-radius: 3px;
    padding: 0 4px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .remote-row .remote-address {
    font-size: 0.85em;
    opacity: 0.75;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .remote-row .delete-remote {
    opacity: 0.6;
    background: none;
    border: none;
    color: inherit;
    cursor: pointer;
    font-size: 1em;
    padding: 2px 4px;
    flex-shrink: 0;
  }
  .remote-row .delete-remote:hover {
    opacity: 1;
  }
  .empty-remotes {
    opacity: 0.7;
    font-size: 0.9em;
  }
</style>
</head>
<!-- data-nonce is how main.js reads the nonce. It must NOT go back to
     document.currentScript: main.js is loaded as a module script, where
     document.currentScript is always null (HTML spec), which made reading
     .nonce off it throw and killed the entire script.
     data-connection-id is empty for a new connection and set to the
     existing connection's id when editing: main.js includes it in the save
     payload so the host knows to update() rather than add(). -->
<body data-nonce="{{NONCE}}" data-connection-id="{{CONNECTION_ID}}">
<div class="page">
<div class="remotes-sidebar">
  <div class="sidebar-header">
    <span>Remotes</span>
    <vscode-button id="addRemote" appearance="secondary">+ Add</vscode-button>
  </div>
  <div id="remotesList"></div>
</div>
<div class="form-main">
<h2 id="formHeading">{{HEADING}}</h2>
<form id="connectionForm">
  <div class="field">
    <label class="field-label" for="name">Connection Name</label>
    <vscode-text-field id="name" placeholder="staging" value="{{NAME}}"></vscode-text-field>
  </div>
  <!-- Unchecked (global) is the historical, only behavior and stays the
       default for a brand-new connection: visible from every workspace. -->
  <div class="field field-checkbox">
    <vscode-checkbox id="workspaceScope"{{WORKSPACE_SCOPE_CHECKED}}>Only available in this workspace</vscode-checkbox>
    <span class="field-hint">Leave unchecked to make this connection visible from every workspace.</span>
  </div>
  <div class="two-up">
    <div class="field">
      <label class="field-label" for="host">Host</label>
      <vscode-text-field id="host" placeholder="example.com" value="{{HOST}}"></vscode-text-field>
    </div>
    <div class="field" style="max-width: 100px;">
      <label class="field-label" for="port">Port</label>
      <vscode-text-field id="port" value="{{PORT}}"></vscode-text-field>
    </div>
  </div>
  <div class="field">
    <label class="field-label" for="username">Username</label>
    <vscode-text-field id="username" placeholder="deploy" value="{{USERNAME}}"></vscode-text-field>
  </div>

  <h2>Authentication</h2>
  <div class="field">
    <label class="field-label" for="authMethod">Auth Method</label>
    <vscode-dropdown id="authMethod">
      <vscode-option value="password"{{PASSWORD_SELECTED}}>Password</vscode-option>
      <vscode-option value="key"{{KEY_SELECTED}}>SSH Key</vscode-option>
      <vscode-option value="agent"{{AGENT_SELECTED}}>Agent</vscode-option>
    </vscode-dropdown>
  </div>
  <!-- Credential inputs. main.js toggles each wrapper's `hidden` property from
       the Auth Method dropdown and only ever posts the fields belonging to the
       selected method. The key PATH is a plain text input on purpose: it is a
       filesystem path, not a secret, and only the path is ever persisted.
       A password/passphrase field is always left blank on load, even when
       editing a connection that already has one stored: a stored secret
       never travels back out of SecretStorage into the webview. Leaving it
       blank on save keeps the existing secret untouched. -->
  <div class="field" data-auth-field="password">
    <label class="field-label" for="password">Password{{PASSWORD_BLANK_HINT}}</label>
    <vscode-text-field id="password" type="password"></vscode-text-field>
  </div>
  <div class="field" data-auth-field="key" hidden>
    <label class="field-label" for="keyPath">SSH Key Path</label>
    <div class="field-row">
      <vscode-text-field id="keyPath" placeholder="/home/you/.ssh/id_ed25519" value="{{KEY_PATH}}"></vscode-text-field>
      <vscode-button id="browseKeyPath" appearance="secondary">Browse...</vscode-button>
    </div>
  </div>
  <div class="field" data-auth-field="key" hidden>
    <label class="field-label" for="keyPassphrase">Key Passphrase (optional){{PASSPHRASE_BLANK_HINT}}</label>
    <vscode-text-field id="keyPassphrase" type="password"></vscode-text-field>
  </div>

  <h2>Remote</h2>
  <div class="field">
    <label class="field-label" for="remotePath">Remote Path</label>
    <vscode-text-field id="remotePath" placeholder="/var/www" value="{{REMOTE_PATH}}"></vscode-text-field>
  </div>

  <h2>Path Mappings</h2>
  <div class="field">
    <div id="mappingsRows"></div>
    <vscode-button id="mappingAdd" appearance="secondary">+ Add mapping</vscode-button>
    <div id="mappingsError" role="alert"></div>
  </div>

  <div class="actions">
    <vscode-button id="save">Save</vscode-button>
    <vscode-button id="testConnection" appearance="secondary">Test Connection</vscode-button>
  </div>
  <div id="testResult" role="status"></div>
</form>
</div>
</div>
<!-- Every saved connection's non-secret fields, read by main.js to render
     the sidebar list and to populate the form when a row is clicked --
     entirely client-side, since nothing here is a secret. -->
<script type="application/json" id="connections-data">{{CONNECTIONS_JSON}}</script>
<script type="module" nonce="{{NONCE}}" src="{{TOOLKIT_URI}}"></script>
<script type="module" nonce="{{NONCE}}" src="{{MAIN_URI}}"></script>
</body>
</html>
