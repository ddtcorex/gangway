services:
  sftp:
    image: atmoz/sftp:latest
    ports:
      - "2223:22"
    # atmoz/sftp user spec is user:pass:uid:gid:dirs. The fixture dir is a
    # HOST bind-mount, so the container user must share the host user's uid
    # or one side loses write access: seed writes from the host fail with
    # EACCES, uploads from the container fail with "Permission denied"
    # (both seen in CI 2026-09-18, runner uid 1001 vs image default 1000).
    # CI exports E2E_SFTP_UID/GID=$(id -u)/$(id -g); local default 1000 fits
    # a typical single-user Linux box, otherwise export the same way.
    command: testuser:testpass:${E2E_SFTP_UID:-1000}:${E2E_SFTP_GID:-1000}:var/www
    volumes:
      - ./sftp-data:/home/testuser/var/www
    healthcheck:
      # atmoz/sftp ships neither nc nor curl/wget; grep for sshd's listening
      # port (22 == 0x0016) directly in /proc/net/tcp instead.
      test: ["CMD-SHELL", "grep -q ':0016 ' /proc/net/tcp"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
