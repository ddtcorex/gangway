name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Reusable harness gate: frozen install -> esbuild -> vitest.
    # require-lib-index is off: this repo ships dist/extension.js (vsce),
    # not a Cordis lib/index.js. No packageManager pin in the manifest, so
    # the pnpm version must be passed explicitly here.
    uses: ddtcorex/dsh-maestro-ci/.github/workflows/node-plugin.yml@7acac89da2ba99457f8b4edfc683ce621ecacc21
    with:
      pnpm-version: "11"
      node-version: "22"
      run-build: true
      require-lib-index: false

  e2e:
    runs-on: ubuntu-latest
    # Backstop for the runner watchdog (GANGWAY_E2E_TIMEOUT_MS, 15 min):
    # the watchdog cannot reap the spawned VS Code process, so the job
    # itself must die first. See docs/testing.md rule 1.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build extension + e2e
        run: pnpm run build && pnpm run build:e2e

      # Real-browser check the unit/jsdom suite structurally cannot express
      # (module-script semantics, a real CSP, real mouse events on the
      # toolkit's custom elements) -- see docs/testing.md rule 3 and the
      # script's own header. ubuntu-latest ships Chrome, so no extra setup.
      - name: Verify the connection-form webview in a real browser
        run: node scripts/verify-webview.mjs

      - name: Start SFTP fixture
        working-directory: test/fixtures
        # Align the container sftp user with the runner uid (see the compose
        # file): otherwise the bind-mounted fixture is writable from only one
        # side (EACCES seeding vs Permission denied uploading).
        run: E2E_SFTP_UID=$(id -u) E2E_SFTP_GID=$(id -g) docker compose -f docker-compose.sftp.yml up -d --wait

      # The fixture dir is a bind-mount: once the container is up it is
      # owned by the container's user, and resetFixture()'s host-side seed
      # write would fail with EACCES without this (red e2e, 2026-09-18).
      - name: Take back fixture ownership
        run: sudo chown -R $(id -u):$(id -g) test/fixtures/sftp-data

      # The docker-backed suites (test/*.integration.test.ts) skip unless
      # GANGWAY_SFTP=1 is set, so without this step the fixture above only
      # serves the e2e run and docs/testing.md's "required for transfer
      # changes" gate stays unenforced. They run here, on the same fixture,
      # before the e2e run hands it to the extension host.
      - name: Run docker-integration suites
        run: GANGWAY_SFTP=1 pnpm test

      - name: Run e2e (headless)
        run: xvfb-run -a node ./out/test/runE2e.js

      - name: Stop SFTP fixture
        if: always()
        working-directory: test/fixtures
        run: docker compose -f docker-compose.sftp.yml down -v
