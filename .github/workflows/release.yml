name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: "11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Version == tag gate
        run: |
          v="$(jq -r .version package.json)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$v" != "$tag" ]; then
            echo "package.json version ($v) != tag ($tag)"; exit 1
          fi

      # --no-dependencies: pnpm build (esbuild) already bundled every
      # runtime dependency into dist/extension.js -- vsce does not need
      # to (and should not) run its own dependency pass on top of that.
      # It also sidesteps vsce shelling out to `npm ls` for dependency
      # detection, which fails outright in a pnpm-only repo (verified
      # locally while wiring this workflow -- npm reports dozens of
      # "missing" peer/dev deps of transitive packages that pnpm never
      # installs because they're irrelevant to this build).
      - name: Package
        run: pnpm dlx --allow-build=@vscode/vsce-sign @vscode/vsce package --no-dependencies -o gangway.vsix

      # Publishing to the VS Code Marketplace needs an Azure DevOps
      # publisher account, which needs a card on file for identity
      # verification -- not available here (see the design spec's
      # "Amendment" section). Open VSX (open-vsx.org, used by VSCodium/
      # Gitpod/Theia) authenticates via GitHub only. Re-adding the
      # Marketplace as a second target later just needs one more step
      # here (`vsce publish --packagePath gangway.vsix -p $VSCE_PAT`,
      # reusing this same .vsix) plus a VSCE_PAT secret.
      - name: Publish to Open VSX
        run: pnpm dlx --allow-build=@vscode/vsce-sign --allow-build=keytar ovsx publish gangway.vsix -p ${{ secrets.OVSX_PAT }}

      # Same pattern as ddtcorex/dsh-maestro-ci node-release.yml: take the
      # matching `## [X.Y.Z]` section from CHANGELOG.md as the release body
      # and let GitHub append its auto-generated notes on top.
      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md || true
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: gangway.vsix
