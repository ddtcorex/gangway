name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  # azure/login@v3 requests a GitHub Actions OIDC token to assume the Entra ID
  # identity federated to the `marketplace` environment. No client secret is
  # stored anywhere (see docs/publishing.md).
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The federated credential's subject is
    # repo:ddtcorex/gangway:environment:marketplace, so this job must be bound to
    # that environment for the token exchange to match. Required reviewers on
    # the environment also turn the publish into a human-gated step.
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: "11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Version == tag gate
        run: |
          v="$(jq -r .version package.json)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$v" != "$tag" ]; then
            echo "package.json version ($v) != tag ($tag)"; exit 1
          fi

      # --no-dependencies: pnpm build (esbuild) already bundled every
      # runtime dependency into dist/extension.js -- vsce does not need
      # to (and should not) run its own dependency pass on top of that.
      # It also sidesteps vsce shelling out to `npm ls` for dependency
      # detection, which fails outright in a pnpm-only repo (verified
      # locally while wiring this workflow -- npm reports dozens of
      # "missing" peer/dev deps of transitive packages that pnpm never
      # installs because they're irrelevant to this build).
      - name: Package
        run: pnpm dlx --allow-build=@vscode/vsce-sign @vscode/vsce package --no-dependencies -o gangway.vsix

      # Open VSX (open-vsx.org, used by VSCodium, Gitpod, Theia) still
      # authenticates with a PAT secret. --skip-duplicate keeps a re-run of an
      # already-published tag idempotent, which matters because the Marketplace
      # step below can fail on its own (see docs/publishing.md).
      - name: Publish to Open VSX
        run: pnpm dlx --allow-build=@vscode/vsce-sign --allow-build=keytar ovsx publish gangway.vsix -p ${{ secrets.OVSX_PAT }} --skip-duplicate

      # Gated on a repository variable so a tag cannot fail the release while
      # the Marketplace identity is still being set up. Flip
      # MARKETPLACE_PUBLISH to true once the checklist in docs/publishing.md is
      # done. A failure here stops the run before the GitHub Release step, so a
      # release is not announced while the Marketplace is still missing.
      #
      # Authentication is Microsoft Entra ID, not a PAT and not the Marketplace
      # trusted publishing flow: azure/login@v3 signs the Azure CLI in with the
      # federated credential on the `marketplace` environment, and vsce's
      # --azure-credential picks that session up (src/auth.ts chains
      # EnvironmentCredential, AzureCliCredential, ManagedIdentityCredential).
      # No client secret and no `vsce publish --oidc`.
      - name: Sign in for Marketplace publishing
        if: vars.MARKETPLACE_PUBLISH == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to VS Code Marketplace
        if: vars.MARKETPLACE_PUBLISH == 'true'
        run: pnpm dlx --allow-build=@vscode/vsce-sign @vscode/vsce publish --packagePath gangway.vsix --azure-credential --skip-duplicate

      # Same pattern as ddtcorex/dsh-maestro-ci node-release.yml: take the
      # matching `## [X.Y.Z]` section from CHANGELOG.md as the release body
      # and let GitHub append its auto-generated notes on top.
      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md || true
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: gangway.vsix
